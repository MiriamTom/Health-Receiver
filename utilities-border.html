<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firestore Data Viewer</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script> <!-- For Gzip decompression -->
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h2>Decompressed Firestore Data</h2>
    <div id="tables-container">Loading...</div>

    <script>
        // 🔥 Firebase Configuration
        const firebaseConfig = {
            authDomain: "bachelor-thesis-9bd4c.firebaseapp.com",
            projectId: "bachelor-thesis-9bd4c",
            storageBucket: "bachelor-thesis-9bd4c.appspot.com",
        };

        // 🔥 Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 📌 Fetch and Display Data
        async function fetchData() {
            try {
                // Get the latest document from Firestore
                const snapshot = await db.collection("databases").orderBy("timestamp", "desc").limit(1).get();

                if (snapshot.empty) {
                    document.getElementById("tables-container").innerHTML = "<p>No data found.</p>";
                    return;
                }

                snapshot.forEach(doc => {
                    let compressedData = doc.data().data;  // 🔥 Replace 'data' with your actual field name
                    
                    // Decode from Base64
                    let binaryData = atob(compressedData);

                    // Convert binary string to Uint8Array
                    let uint8Array = new Uint8Array(binaryData.length);
                    for (let i = 0; i < binaryData.length; i++) {
                        uint8Array[i] = binaryData.charCodeAt(i);
                    }

                    // Decompress using Pako (for Gzip)
                    let decompressedData = new TextDecoder().decode(pako.inflate(uint8Array));

                    // Try parsing as JSON
                    let jsonData;
                    try {
                        jsonData = JSON.parse(decompressedData);
                    } catch (error) {
                        console.warn("Data is not valid JSON, displaying raw text.");
                        document.getElementById("tables-container").innerHTML = `<pre>${decompressedData}</pre>`;
                        return;
                    }

                    // Render Tables
                    renderTables(jsonData);
                });
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById("tables-container").innerHTML = "<p>Error loading data.</p>";
            }
        }

        function renderTables(jsonData) {
            const container = document.getElementById("tables-container");
            container.innerHTML = ""; // Clear previous content

            // Group data by table_name
            let tables = {};
            jsonData.forEach(item => {
                const tableName = item.table_name || "UNKNOWN_TABLE";
                if (!tables[tableName]) {
                    tables[tableName] = [];
                }
                tables[tableName].push(item);
            });

            // Create tables dynamically
            for (let tableName in tables) {
                const tableData = tables[tableName];

                // Extract columns dynamically
                let columns = new Set();
                tableData.forEach(row => {
                    Object.keys(row).forEach(key => columns.add(key));
                });
                columns = Array.from(columns);

                // Create table
                let tableHtml = `<h3>${tableName}</h3><table><thead><tr>`;
                columns.forEach(col => {
                    tableHtml += `<th>${col}</th>`;
                });
                tableHtml += `</tr></thead><tbody>`;

                // Fill table with data
                tableData.forEach(row => {
                    tableHtml += `<tr>`;
                    columns.forEach(col => {
                        let cellValue = row[col] !== undefined ? row[col] : "";
                        // Convert timestamp to human-readable format
                        if (col === "timestamp" && typeof cellValue === "number") {
                            cellValue = formatTimestamp(cellValue);
                        }
                        tableHtml += `<td>${cellValue}</td>`;
                    });
                    tableHtml += `</tr>`;
                });

                tableHtml += `</tbody></table>`;
                container.innerHTML += tableHtml;
            }
        }

        // Helper function to format timestamp
        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0"); // Months are 0-based
            const day = String(date.getDate()).padStart(2, "0");
            const hours = String(date.getHours()).padStart(2, "0");
            const minutes = String(date.getMinutes()).padStart(2, "0");
            const seconds = String(date.getSeconds()).padStart(2, "0");

            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }

        fetchData();
    </script>
</body>
</html>
